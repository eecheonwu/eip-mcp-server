[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eip-mcp-server"
version = "0.1.0"
description = "EIP MCP Server for integration with the EIP Web App"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "requests",
    "google-genai",
    "python-dotenv",
    "pydantic",
    "fastapi",
    "uvicorn"
]

[project.scripts]
eip-mcp-server = "eip_mcp_server.server:mcp.run"
